service CJson {
  rpc OpenSession (OpenSessionRequest) returns (OpenSessionResponse);
  rpc CloseSession (CloseSessionRequest) returns (CloseSessionResponse);
  rpc CJSONVersion (CJSONVersionRequest) returns (CJSONVersionResponse);   // stateless: no session required
  rpc CJSONParse (CJSONParseRequest) returns (CJSONParseResponse);
  rpc CJSONParseWithLength (CJSONParseWithLengthRequest) returns (CJSONParseWithLengthResponse);
  rpc CJSONPrint (CJSONPrintRequest) returns (CJSONPrintResponse);
  rpc CJSONPrintUnformatted (CJSONPrintUnformattedRequest) returns (CJSONPrintUnformattedResponse);
  rpc CJSONPrintBuffered (CJSONPrintBufferedRequest) returns (CJSONPrintBufferedResponse);
  rpc CJSONDelete (CJSONDeleteRequest) returns (CJSONDeleteResponse);
  rpc CJSONGetArraySize (CJSONGetArraySizeRequest) returns (CJSONGetArraySizeResponse);
  rpc CJSONGetArrayItem (CJSONGetArrayItemRequest) returns (CJSONGetArrayItemResponse);
  rpc CJSONGetObjectItem (CJSONGetObjectItemRequest) returns (CJSONGetObjectItemResponse);
  rpc CJSONGetObjectItemCaseSensitive (CJSONGetObjectItemCaseSensitiveRequest) returns (CJSONGetObjectItemCaseSensitiveResponse);
  rpc CJSONHasObjectItem (CJSONHasObjectItemRequest) returns (CJSONHasObjectItemResponse);
  rpc CJSONGetErrorPtr (CJSONGetErrorPtrRequest) returns (CJSONGetErrorPtrResponse);   // stateless: no session required
  rpc CJSONGetStringValue (CJSONGetStringValueRequest) returns (CJSONGetStringValueResponse);
  rpc CJSONGetNumberValue (CJSONGetNumberValueRequest) returns (CJSONGetNumberValueResponse);
  rpc CJSONIsInvalid (CJSONIsInvalidRequest) returns (CJSONIsInvalidResponse);
  rpc CJSONIsFalse (CJSONIsFalseRequest) returns (CJSONIsFalseResponse);
  rpc CJSONIsTrue (CJSONIsTrueRequest) returns (CJSONIsTrueResponse);
  rpc CJSONIsBool (CJSONIsBoolRequest) returns (CJSONIsBoolResponse);
  rpc CJSONIsNull (CJSONIsNullRequest) returns (CJSONIsNullResponse);
  rpc CJSONIsNumber (CJSONIsNumberRequest) returns (CJSONIsNumberResponse);
  rpc CJSONIsString (CJSONIsStringRequest) returns (CJSONIsStringResponse);
  rpc CJSONIsArray (CJSONIsArrayRequest) returns (CJSONIsArrayResponse);
  rpc CJSONIsObject (CJSONIsObjectRequest) returns (CJSONIsObjectResponse);
  rpc CJSONIsRaw (CJSONIsRawRequest) returns (CJSONIsRawResponse);
  rpc CJSONCreateNull (CJSONCreateNullRequest) returns (CJSONCreateNullResponse);
  rpc CJSONCreateTrue (CJSONCreateTrueRequest) returns (CJSONCreateTrueResponse);
  rpc CJSONCreateFalse (CJSONCreateFalseRequest) returns (CJSONCreateFalseResponse);
  rpc CJSONCreateBool (CJSONCreateBoolRequest) returns (CJSONCreateBoolResponse);
  rpc CJSONCreateNumber (CJSONCreateNumberRequest) returns (CJSONCreateNumberResponse);
  rpc CJSONCreateString (CJSONCreateStringRequest) returns (CJSONCreateStringResponse);
  rpc CJSONCreateRaw (CJSONCreateRawRequest) returns (CJSONCreateRawResponse);
  rpc CJSONCreateArray (CJSONCreateArrayRequest) returns (CJSONCreateArrayResponse);
  rpc CJSONCreateObject (CJSONCreateObjectRequest) returns (CJSONCreateObjectResponse);
  rpc CJSONCreateStringReference (CJSONCreateStringReferenceRequest) returns (CJSONCreateStringReferenceResponse);
  rpc CJSONCreateObjectReference (CJSONCreateObjectReferenceRequest) returns (CJSONCreateObjectReferenceResponse);
  rpc CJSONCreateArrayReference (CJSONCreateArrayReferenceRequest) returns (CJSONCreateArrayReferenceResponse);
  rpc CJSONAddItemToArray (CJSONAddItemToArrayRequest) returns (CJSONAddItemToArrayResponse);
  rpc CJSONAddItemToObject (CJSONAddItemToObjectRequest) returns (CJSONAddItemToObjectResponse);
  rpc CJSONAddItemToObjectCS (CJSONAddItemToObjectCSRequest) returns (CJSONAddItemToObjectCSResponse);
